[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde_json = { workspace = true }
# precompressed web bundle (`cargo xtask web`); pure Rust
flate2 = "1"
brotli = { version = "8", default-features = false, features = ["std"] }
# AI mask models (`cargo xtask models`): reading PyTorch checkpoints, writing safetensors,
# checking downloads; pure Rust
lightcraft-segment = { workspace = true }
candle-core = { workspace = true }
sha2 = "0.10"
